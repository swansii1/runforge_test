<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/runforge-icon.png" />
    <script>
      try {
        if (localStorage.getItem("runforge-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {
        // Keep the default light theme when storage is unavailable.
      }
    </script>
    <link rel="stylesheet" href="/src/app/styles/global.css" />
    <title>Runforge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
